KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_shop="shop-secret"
    user_client="client-secret"
    user_moderator="moderator-secret"
    user_streams="streams-secret"
    user_connect="connect-secret"
    user_mirror="mirror-secret"
    user_analytics="analytics-secret";
};

// Логин брокера в ZooKeeper (SASL DIGEST), пароль должен совпадать с security/zookeeper.sasl.jaas.conf
Client {
    org.apache.zookeeper.server.auth.DigestLoginModule required
    username="admin"
    password="zk-secret";
};

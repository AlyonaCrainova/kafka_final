global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/kafka-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Основной кластер: JMX Exporter на каждом брокере (порт 7071)
  - job_name: 'kafka-main'
    static_configs:
      - targets: ['kafka-0:7071', 'kafka-1:7071', 'kafka-2:7071']
        labels:
          cluster: 'main'

  # Второй кластер (резервное копирование и аналитика)
  - job_name: 'kafka-second'
    static_configs:
      - targets: ['kafka-3:7071', 'kafka-4:7071', 'kafka-5:7071']
        labels:
          cluster: 'second'

  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['kafka-connect:7071']
        labels:
          cluster: 'main'

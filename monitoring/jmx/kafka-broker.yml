lowercaseOutputName: true
rules:
  # Счётчики пропускной способности: MessagesInPerSec, BytesInPerSec и т.п.
  - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
    name: kafka_server_$1_$2_total
    type: COUNTER

  # Состояние брокера и репликации: UnderReplicatedPartitions, OfflinePartitionsCount и т.п.
  - pattern: kafka.server<type=(.+), name=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE

  # Контроллер кластера: ActiveControllerCount, OfflinePartitionsCount
  - pattern: kafka.controller<type=(.+), name=(.+)><>Value
    name: kafka_controller_$1_$2
    type: GAUGE

  # Сетевые запросы: RequestMetrics (Produce, Fetch, TotalTimeMs и т.п.)
  - pattern: kafka.network<type=(.+), name=(.+)><>Count
    name: kafka_network_$1_$2_total
    type: COUNTER
